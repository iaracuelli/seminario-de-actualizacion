<script type="text/javascript">

class Model extends EventTarget {
    constructor() {
        super();
        
    }
   
    changed() {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}


class View extends HTMLElement {
    constructor() 
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 200;
        this._canvas.height = 400;
        this._canvas.style.border = '1px solid black';

        let ctx = this._canvas.getContext('2d');

        this.appendChild(this._canvas);

        this._color1 = document.createElement('input');
        this._color1.type = "color";
        this._color2 = document.createElement('input');
        this._color2.type = "color";
        this.appendChild(this._color1);
        this.appendChild(this._color2);

        this._color1.addEventListener('input', this.drawColorGradient.bind(this, ctx));
        this._color2.addEventListener('input', this.drawColorGradient.bind(this, ctx));

        this.drawColorGradient(ctx);
    }

    drawColorGradient(ctx)
    {  
        let gradient = ctx.createLinearGradient(0, 0, 200, 0);

        gradient.addColorStop(0, this._color1.value);
        gradient.addColorStop(1, this._color2.value);

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 200, 400);

        //console.log(this._color1.value, this._color2.value);

    }
}
customElements.define('x-view', View);


class Controller {
    constructor(view, model) {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);
    }
    enable() {
        this._model.addEventListener('changed', this._onModelChanged);
        this._view.addEventListener('request', this._onViewRequest);
    }
    disable() {
        this._model.removeEventListener('changed', this._onModelChanged);
        this._view.removeEventListener('request', this._onViewRequest);
    }
    onModelChanged() {
        
    }
    onViewRequest(event) {
       
    }
}

function main() {
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    myController.enable();
    document.body.appendChild(myView);
}
window.onload = main;

</script>
