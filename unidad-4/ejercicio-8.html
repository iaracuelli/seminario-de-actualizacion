<script type="text/javascript">

class Model extends EventTarget {
    constructor() {
        super();
        
    }
   
    changed() {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}

class View extends HTMLElement {
    constructor() 
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 500;
        this._canvas.height = 500;
        this._canvas.style.border = '1px solid black';

        let ctx = this._canvas.getContext('2d');

        this.drawPieChartV2(ctx, this._canvas);

        this.appendChild(this._canvas);
    }

    drawPieChartV2(ctx, canvas)
    {
        let xc = canvas.width/2;
        let yc = canvas.height/2;
        let r = canvas.width/2; 

        let data = [
                    {label: "item1", percentage: 0.30},
                    {label: "item2", percentage: 0.50},
                    {label: "item3", percentage: 0.10},
                    {label: "item4", percentage: 0.10}
                    ];

        let colors = ["red", "blue", "yellow", "orange"];

        let accumulatedAngle = 0;
    
        for (let i = 0; i < data.length; i++)
        {
            let ia = accumulatedAngle * (2 * Math.PI);
            let fa = ia + (data[i].percentage * (2 * Math.PI));

            ctx.beginPath();
            ctx.moveTo(xc, yc);
            ctx.arc(xc, yc, r, ia, fa);
            ctx.closePath();
            ctx.fillStyle = colors[i];
            ctx.fill();
            
            accumulatedAngle = accumulatedAngle + data[i].percentage;
            
            let middleAngle = (ia + fa) / 2;
            let radio = r / 2;
            let x = xc + radio * Math.cos(middleAngle);
            let y = yc + radio * Math.sin(middleAngle);
            ctx.fillStyle = "black";
            ctx.fillText(data[i].label + ": " + data[i].percentage * 100 + "%", x, y);


        }
    }
    
    connectedCallback() {
       console.log('Canvas agregado...')
    }
    
}
customElements.define('x-view', View);


class Controller {
    constructor(view, model) {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);
    }
    enable() {
        this._model.addEventListener('changed', this._onModelChanged);
        this._view.addEventListener('request', this._onViewRequest);
    }
    disable() {
        this._model.removeEventListener('changed', this._onModelChanged);
        this._view.removeEventListener('request', this._onViewRequest);
    }
    onModelChanged() {
        
    }
    onViewRequest(event) {
       
    }
}

function main() {
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    myController.enable();
    document.body.appendChild(myView);
}
window.onload = main;

</script>
